<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family App 初期設定</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            background: #f0f0f0;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 1.2rem;
            margin-top: 0;
        }

        textarea {
            width: 100%;
            height: 150px;
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            text-decoration: none;
            color: #007bff;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🛠️ Family App 初期設定</h1>
        <p>Firebaseの構成設定(JSON)をここに貼り付けてください。</p>

        <textarea id="config-input" placeholder='{"apiKey": "...", "projectId": "..."}'></textarea>
        <button id="save-btn">設定を保存する</button>

        <div id="status-msg" class="status"></div>

        <a href="./index.html" class="back-link">アプリに戻る &rarr;</a>
    </div>

    <script>
        const input = document.getElementById('config-input');
        const btn = document.getElementById('save-btn');
        const status = document.getElementById('status-msg');

        // 現在の設定を表示
        const current = localStorage.getItem('firebase_config');
        if (current) {
            input.value = current;
            status.textContent = '✅ 設定済みです';
            status.className = 'status success';
            status.style.display = 'block';
        }

        btn.onclick = function () {
            try {
                const val = input.value.trim();
                let jsonStr = val;

                if (!jsonStr) {
                    alert('空っぽです');
                    return;
                }

                // 補正: const ... = 等の削除
                if (jsonStr.startsWith('const')) {
                    jsonStr = jsonStr.substring(jsonStr.indexOf('{'));
                }
                // 末尾のセミコロン削除
                if (jsonStr.endsWith(';')) {
                    jsonStr = jsonStr.substring(0, jsonStr.length - 1);
                }

                // パース試行
                // new Functionなど使わず、単純なJSONとしてパースしてみる
                // ユーザーがコピーするのは通常JSオブジェクトだが、JSON形式に修正して貼り付けてもらうか、
                // あるいはここでも緩いパースを行う。
                // 安全のため、ここでも new Function を使う（ローカル設定なので）
                const config = (new Function(`return ${jsonStr}`))();

                if (!config.apiKey || !config.projectId) {
                    throw new Error('apiKey または projectId が含まれていません');
                }

                localStorage.setItem('firebase_config', JSON.stringify(config, null, 2));

                status.textContent = '✅ 保存しました！「アプリに戻る」を押してください。';
                status.className = 'status success';
                status.style.display = 'block';

            } catch (e) {
                status.textContent = '❌ エラー: ' + e.message;
                status.className = 'status error';
                status.style.display = 'block';
            }
        };
    </script>
</body>

</html>
